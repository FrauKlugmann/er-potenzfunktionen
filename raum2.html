<style>
/* Layout: Laborbild als Bühne mit Status-Anzeigen im Bild; Aufträge öffnen sich als Terminal-Fenster. Bewusst ein dunkles Labor-Design. */
[hidden]{display:none!important}
:root{
  --void:#08111f;
  --panel:#0f2036;
  --panel-2:#16304f;
  --line:#2c5a86;
  --text:#e6f1ff;
  --muted:#93acc8;
  --cyan:#3fe0ff;
  --yellow:#ffd23f;
  --magenta:#ff5bd8;
  --ok:#3ee08f;
  --bad:#ff5b6b;
  --display:"Orbitron","Trebuchet MS",sans-serif;
  --body:"Exo 2","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;background:var(--void);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .school{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.topbar .room{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 12px rgba(63,224,255,.45)}

.scene{position:relative;width:100%;max-width:100%;aspect-ratio:1672/941;border:2px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 28px rgba(63,224,255,.18);background:#000;container-type:inline-size}
.scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:2px dashed var(--cyan);outline-offset:2px}

/* Anzeigen im Bild */
.h-top,.h-prog,.h-inv{position:absolute;z-index:2;font-family:var(--display);font-weight:800;color:var(--text)}
.glass{background:rgba(8,20,36,.82);border:.2cqw solid var(--cyan);box-shadow:0 0 1.2cqw rgba(63,224,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.h-top{right:1.2%;top:1.6%;height:7%;display:flex;gap:.6cqw;font-size:1.8cqw}
.h-pill{height:100%;display:flex;align-items:center;gap:.6cqw;padding:0 1.1cqw;border-radius:1cqw;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-pill.late{color:var(--bad);border-color:var(--bad)}
.h-gear{height:100%;aspect-ratio:1;border-radius:1cqw;font-size:1.1em;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--text)}
.h-gear:hover,.map:hover{border-color:var(--yellow)}
.h-gear:focus-visible,.map:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.h-prog{left:1.2%;bottom:2.4%;width:19%;padding:.8cqw 1.1cqw;border-radius:1cqw;font-size:1.15cqw;display:flex;flex-direction:column;gap:.5cqw}
.h-lab{letter-spacing:.08em;color:var(--cyan)}
.h-dots{display:flex;justify-content:space-between}
.h-dots>span{display:flex;flex-direction:column;align-items:center;gap:.2cqw;font-size:.95em}
.h-dots i{width:2cqw;height:2cqw;border-radius:50%;border:.2cqw solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8em;color:#06121f}
.h-dots i.on{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 .8cqw var(--yellow)}
.h-dots i.ok{background:var(--ok);border-color:var(--ok)}
.h-inv{left:28%;bottom:2.4%;width:40%;padding:.7cqw 1cqw;border-radius:1cqw;display:flex;align-items:center;gap:.8cqw;font-size:1.15cqw}
.h-inv .h-lab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.95em}
.h-slots{display:flex;gap:.7cqw;flex:1}
.h-slots .s{flex:1;aspect-ratio:1.1;border-radius:.7cqw;border:.2cqw dashed var(--line);display:grid;place-items:center;font-size:1.7cqw;color:#06121f;background:rgba(255,255,255,.03);padding:0;font-family:var(--display);font-weight:800}
.h-slots .s.got{background:var(--yellow);border:.2cqw solid var(--yellow);box-shadow:0 0 1cqw rgba(255,210,63,.5)}
.h-slots .map{border-style:solid;border-color:var(--cyan);cursor:pointer;font-size:2.2cqw;color:var(--text)}

footer{color:var(--muted);text-align:right;font-size:.85rem;padding-top:4px}

/* Terminal-Fenster */
.overlay{position:fixed;inset:0;background:rgba(2,8,16,.78);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel) 120px);border:2px solid var(--cyan);border-radius:12px;box-shadow:0 0 40px rgba(63,224,255,.25);width:min(820px,100%);max-height:100%;overflow:auto;padding:20px 22px 22px;position:relative;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.04em;margin:0;line-height:1.2;text-wrap:balance;color:var(--cyan)}
.panel p{margin:0}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:1.2rem;font-weight:800;cursor:pointer;line-height:1}
.close:hover{border-color:var(--bad);color:var(--bad)}
.close:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:48px}
.label{font-family:var(--display);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:2rem;font-weight:700;text-align:center;color:var(--yellow);letter-spacing:.02em}
.eq sup{font-size:.6em}
.task{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:center}
.graphbox{background:#06101d;border:1px solid var(--line);border-radius:10px;padding:6px}
svg.graph{width:100%;height:auto;display:block}
.choices{display:flex;flex-direction:column;gap:10px}
.choices4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices4 .choice{font-family:"Cambria Math","Times New Roman",serif;font-size:1.15rem;letter-spacing:0;font-weight:700;justify-content:flex-start;min-height:3.4em}
.choices4 .choice .lt{font-family:var(--display);font-size:.8rem;color:var(--cyan);border:1px solid var(--line);border-radius:6px;padding:.15em .45em;flex:0 0 auto}
.qbox{display:flex;flex-direction:column;gap:8px}
.qbox .eq{text-align:left}
.prop{display:inline-block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#04121f;background:var(--yellow);border-radius:6px;padding:.25em .6em;font-weight:800;align-self:flex-start}
.mini{max-width:300px}
@media (max-width:640px){.choices4{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.05em;border:2px solid var(--line);border-radius:10px;padding:.8em 1em;cursor:pointer;color:var(--text);background:var(--panel);text-align:left}
.choice:hover:not(:disabled){border-color:var(--cyan);background:var(--panel-2)}
.choice:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.choice:disabled{opacity:.35;cursor:default}
.choice.right{border-color:var(--ok);background:rgba(62,224,143,.15);opacity:1}
.choice svg{flex:0 0 auto}
.fb{border-radius:10px;padding:12px 14px;font-weight:600;border:1px solid}
.fb.good{background:rgba(62,224,143,.12);border-color:var(--ok)}
.fb.wrong{background:rgba(255,91,107,.12);border-color:var(--bad)}
.fb.tip{background:rgba(255,210,63,.1);border-color:var(--yellow)}
.fb b.t{font-family:var(--display);font-weight:800;letter-spacing:.04em;display:block;margin-bottom:2px}
.fb.good b.t{color:var(--ok)} .fb.wrong b.t{color:var(--bad)} .fb.tip b.t{color:var(--yellow)}
.btn{font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.06em;background:var(--cyan);color:#04121f;border:2px solid var(--cyan);border-radius:10px;padding:.75em 1.3em;cursor:pointer;box-shadow:0 0 18px rgba(63,224,255,.35);text-decoration:none;display:inline-block}
.btn:hover{background:#86edff}
.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--yellow);text-shadow:0 0 14px rgba(255,210,63,.5)}
.keytags{display:flex;gap:8px;flex-wrap:wrap}
.keytag{border:1px solid var(--line);border-radius:8px;padding:.3em .7em;font-weight:700;font-family:var(--display);font-size:.8rem;letter-spacing:.04em}
.keytag.got{border-color:var(--yellow);color:var(--yellow)}
.merk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.merk .card{display:flex;flex-direction:column;gap:6px}
.merk h4{margin:0;font-family:"Cambria Math","Times New Roman",serif;font-size:1.3rem;color:var(--yellow)}
.merk ul{margin:0;padding-left:1.1em;font-size:.95rem}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats .card{flex:1 1 150px;text-align:center}
.stats .n{font-family:var(--display);font-size:1.9rem;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--cyan)}

/* Tastenfeld */
.keypad{display:flex;flex-direction:column;align-items:center;gap:12px}
.display{display:flex;gap:8px}
.display span{width:50px;height:62px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#030a12;color:var(--ok);font-family:var(--display);font-size:2rem;font-weight:800;text-shadow:0 0 10px rgba(62,224,143,.6)}
.keys10{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keys10 button{height:52px;border:2px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);font-family:var(--display);font-weight:800;font-size:1.25rem;cursor:pointer}
.keys10 button:hover{border-color:var(--cyan)}
.keys10 button:active{transform:translateY(1px)}
.keys10 button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.keys10 .del{color:var(--bad)} .keys10 .go{background:var(--ok);color:#04121f;border-color:var(--ok)}

@media (max-width:640px){
  .task{grid-template-columns:1fr}
  .panel{padding:16px}
  .panel h2{font-size:1.15rem}
  .eq{font-size:1.6rem}
}
.sub{display:flex;gap:6px;align-items:center}
.sub i{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:.65rem;color:var(--muted)}
.sub i.on{border-color:var(--yellow);color:var(--yellow)}
.sub i.ok{background:var(--ok);border-color:var(--ok);color:#04121f}
.task4{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.task4.nog{grid-template-columns:1fr}
.task4 .choice{font-size:1.1rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span{font-size:.92em}
</style>

const nb=t=>t.replace(/; /g,";\u00a0").replace(/−/g,"−\u2060").replace(/ ∞/g,"\u00a0∞");
function options(p,k){
  const right=VAL[p][k];
  const pool=[...new Set([...KEYS.filter(x=>x!==k).map(x=>VAL[p][x]),...EXTRA[p]])].filter(v=>v!==right);
  const opts=shuffle([right,...shuffle(pool).slice(0,3)]);
  return {opts:opts.map(nb),correct:opts.indexOf(right)};
}

/* ---------- Koordinatensystem ---------- */
const R3=6, VB3=400, M3=22, SC3=(VB3-2*M3)/(2*R3);
const P3X=x=>M3+(x+R3)*SC3, P3Y=y=>M3+(R3-y)*SC3;
function shiftGraph(k,d,e){
  const f=FN[k];
  let s=`<svg class="graph" viewBox="0 0 ${VB3} ${VB3}" role="img" aria-label="Koordinatensystem mit dem verschobenen Graphen">`;
  s+=`<defs><clipPath id="clip4"><rect x="${M3}" y="${M3}" width="${VB3-2*M3}" height="${VB3-2*M3}"/></clipPath></defs>`;
  for(let i=-R3;i<=R3;i++){s+=`<line x1="${P3X(i)}" y1="${P3Y(R3)}" x2="${P3X(i)}" y2="${P3Y(-R3)}" stroke="#16324f"/><line x1="${P3X(-R3)}" y1="${P3Y(i)}" x2="${P3X(R3)}" y2="${P3Y(i)}" stroke="#16324f"/>`;}
  s+=`<line x1="${P3X(-R3)}" y1="${P3Y(0)}" x2="${P3X(R3)+8}" y2="${P3Y(0)}" stroke="#cfe3ff" stroke-width="1.6"/><polygon points="${P3X(R3)+12},${P3Y(0)} ${P3X(R3)+4},${P3Y(0)-4} ${P3X(R3)+4},${P3Y(0)+4}" fill="#cfe3ff"/>`;
  s+=`<line x1="${P3X(0)}" y1="${P3Y(-R3)}" x2="${P3X(0)}" y2="${P3Y(R3)-8}" stroke="#cfe3ff" stroke-width="1.6"/><polygon points="${P3X(0)},${P3Y(R3)-12} ${P3X(0)-4},${P3Y(R3)-4} ${P3X(0)+4},${P3Y(R3)-4}" fill="#cfe3ff"/>`;
  s+=`<text x="${P3X(R3)+2}" y="${P3Y(0)+17}" fill="#cfe3ff" font-size="14" font-style="italic" font-family="serif">x</text><text x="${P3X(0)+7}" y="${P3Y(R3)-2}" fill="#cfe3ff" font-size="14" font-style="italic" font-family="serif">y</text>`;
  for(let i=-R3+1;i<R3;i++){if(!i)continue;
    s+=`<line x1="${P3X(i)}" y1="${P3Y(0)-3}" x2="${P3X(i)}" y2="${P3Y(0)+3}" stroke="#cfe3ff"/><text x="${P3X(i)}" y="${P3Y(0)+14}" fill="#93acc8" font-size="10.5" text-anchor="middle" font-family="sans-serif" stroke="#06101d" stroke-width="3" paint-order="stroke">${mi(i)}</text>`;
    s+=`<line x1="${P3X(0)-3}" y1="${P3Y(i)}" x2="${P3X(0)+3}" y2="${P3Y(i)}" stroke="#cfe3ff"/><text x="${P3X(0)-6}" y="${P3Y(i)+4}" fill="#93acc8" font-size="10.5" text-anchor="end" font-family="sans-serif" stroke="#06101d" stroke-width="3" paint-order="stroke">${mi(i)}</text>`;}
  const segs=[];let cur=[];
  for(let x=-R3;x<=R3+1e-9;x+=0.01){const u=x+d;const uu=Math.abs(u)<1e-9?0:u;
    if(!f.ok(uu)){if(cur.length)segs.push(cur);cur=[];continue}
    const y=f.f(uu)+e;if(!isFinite(y)||Math.abs(y)>R3+0.5){if(cur.length)segs.push(cur);cur=[];continue}
    cur.push([x,y]);}
  if(cur.length)segs.push(cur);
  segs.forEach(seg=>{s+=`<path d="${seg.map((p,j)=>(j?"L":"M")+P3X(p[0]).toFixed(1)+","+P3Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="#3fe0ff" stroke-width="3.4" stroke-linecap="round" clip-path="url(#clip4)"/>`;});
  return s+"</svg>";
}

/* ---------- Zustand ---------- */
function readCarry(){
  try{const q=new URLSearchParams(location.search);
    if(q.has("rest")){const c={rest:+q.get("rest"),fehler:+q.get("fehler"),zeit:+q.get("zeit")};
      if([c.rest,c.fehler,c.zeit].every(Number.isFinite)&&c.fehler>=0&&c.zeit>=0)return c;}}catch(e){}
  try{const c=JSON.parse(localStorage.getItem("escape-potenz-r1"));
    if(c&&Number.isFinite(c.rest)&&Date.now()-c.ts<6*3600*1000)return c;}catch(e){}
  return null;
}
const CARRY=readCarry();
const START=MIN*60+(CARRY?Math.max(0,Math.round(CARRY.rest)):0);
let S;
function newState(){
  const fns=shuffle(KEYS), skip=shuffle(ALLP), st={};
  ORDER.forEach((id,i)=>{
    const k=fns[i];
    const qs=ALLP.filter(p=>p!==skip[i]).map(p=>({p,...options(p,k),fails:0}));
    st[id]={done:false,k,d:0,e:0,qs,i:0,digit:i===0?1+rand(9):rand(10)};
  });
  return {started:false,seconds:START,timerOn:true,sound:true,mistakes:0,escaped:false,code:"",st};
}
const keysGot=()=>ORDER.filter(k=>S.st[k].done).length;
function renderAll(){
  ORDER.forEach((k,i)=>{const s=$("#inv"+i);s.className="s"+(S.st[k].done?" got":"");s.textContent=S.st[k].done?S.st[k].digit:"";s.title=S.st[k].done?(i+1)+". Ziffer":"";});
  $("#keycount").textContent=keysGot()+"/"+N;
  const d=$("#dotcur");d.className=S.escaped?"ok":"on";d.textContent=S.escaped?"✓":"";
  renderTimer();
}
function renderTimer(){$("#time").textContent=S.timerOn?fmt(S.seconds):"--:--";$("#timer").classList.toggle("late",S.seconds<0)}
let tick=null;
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!S.started||S.escaped||!S.timerOn)return;S.seconds--;renderTimer();
  if(S.seconds===0&&overlay.hidden)showPanel(`<h2 id="ptitle">Die Zeit ist abgelaufen!</h2><p>Das Experiment läuft weiter … Ihr dürft trotzdem weitermachen – die Uhr zählt jetzt rot weiter.</p><div class="row"><button class="btn" data-close>Weiter</button></div>`);
},1000)}
let AC=null;
function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;o.type=ok?"sine":"square";o.frequency.setValueAtTime(ok?720:180,t);if(ok)o.frequency.setValueAtTime(1080,t+.08);
  g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+(ok?.25:.3));o.start(t);o.stop(t+.3);}catch(e){}}
let lastFocus=null;
function showPanel(html,focusSel){lastFocus=document.activeElement;panel.innerHTML=`<button class="close" data-close aria-label="Schließen">✕</button>`+html;overlay.hidden=false;
  panel.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closePanel));panel.scrollTop=0;
  const f=(focusSel&&panel.querySelector(focusSel))||panel.querySelector(".btn")||panel.querySelector(".close");f&&f.focus();}
function closePanel(){overlay.hidden=true;panel.innerHTML="";renderAll();lastFocus&&lastFocus.focus&&lastFocus.focus();}
overlay.addEventListener("click",e=>{if(e.target===overlay&&S.started)closePanel()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.hidden&&S.started)closePanel()});

function openThing(id){
  if(!S.started){intro();return}
  if(ST[id])return station(id);
  if(id==="tuer"||id==="keypad")return door();
  if(HINT[id])return hintObj(id);
  if(LOOK[id])return showPanel(`<h2 id="ptitle">${LOOK[id][0]}</h2><p>${LOOK[id][1]}</p><div class="row"><button class="btn" data-close>Weitersuchen</button></div>`);
}

function station(id){
  const st=S.st[id],info=ST[id];
  if(st.done){showPanel(`<h2 id="ptitle">${info.title}</h2><div class="fb good"><b class="t">Bereits beantwortet</b>Hier habt ihr die <b>${ORDER.indexOf(id)+1}. Ziffer: ${st.digit}</b> erhalten.</div><div class="row"><button class="btn" data-close>Weitersuchen</button></div>`);return}
  const q=st.qs[st.i];
  showPanel(`<div class="meta"><span class="label">Sicherheitsabfrage · ${info.name} · Frage ${st.i+1} von 4</span><div class="sub">${st.qs.map((x,j)=>`<i class="${j<st.i?"ok":j===st.i?"on":""}">${j<st.i?"✓":j+1}</i>`).join("")}</div></div>
   <h2 id="ptitle">${info.title}</h2>${st.i===0?`<p>${info.intro}</p>`:""}
   <div class="card qbox"><span class="prop">${PNAME[q.p]}</span><p class="eq">${eqHTML(st.k,0,0)}</p><p style="font-weight:700">${PASK[q.p]}</p></div>
   <div class="choices4">${q.opts.map((o,j)=>`<button class="choice" data-c="${j}"><span class="lt">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div>
   <div id="fb" aria-live="polite"></div>`,".choice");
  panel.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(id,+b.dataset.c,b)));
}
function answer(id,c,btn){
  const st=S.st[id],q=st.qs[st.i],fb=$("#fb");
  if(c===q.correct){
    beep(true);panel.querySelectorAll(".choice").forEach(x=>x.disabled=true);btn.classList.add("right");
    const last=st.i===3;
    fb.innerHTML=`<div class="fb good"><b class="t">Abfrage bestätigt!</b>${WHY[q.p][st.k]}</div><div class="row" style="margin-top:10px"><button class="btn" id="next">${last?"Code-Ziffer holen":"Nächste Frage"}</button></div>`;
    $("#next").focus();$("#next").addEventListener("click",()=>{st.i++;if(st.i>=4){st.done=true;foundKey(id)}else station(id)});
    return;
  }
  beep(false);S.mistakes++;q.fails++;btn.disabled=true;
  let h=`<div class="fb wrong"><b class="t">Zugriff verweigert</b>Diese Antwort stimmt nicht.</div><div class="fb tip" style="margin-top:10px"><b class="t">Hinweis</b>${TIP[q.p]}</div>`;
  if(q.fails>=2)h+=`<div class="fb tip" style="margin-top:10px"><b class="t">Hilfe: der Graph</b><p style="margin-bottom:8px">So sieht der Graph von ${eqHTML(st.k,0,0).replace("f(x)","y")} aus:</p><div class="graphbox mini">${shiftGraph(st.k,0,0)}</div></div>`;
  fb.innerHTML=h;
}

    </div>
    <div class="row"><button class="btn" data-close>Zurück in den Reaktorraum</button></div>`);return}
  showPanel(`<h2 id="ptitle">${h.title}</h2>${h.html}<div class="row"><button class="btn" data-close>Zurück in den Reaktorraum</button></div>`);
}
function door(){
  if(S.escaped){const f=$("#finale");f&&f.scrollIntoView({behavior:"smooth"});return}
  const n=keysGot();
  const tags=ORDER.map((k,i)=>`<span class="keytag ${S.st[k].done?"got":""}">${i+1}. Ziffer: ${S.st[k].done?S.st[k].digit:"?"}</span>`).join("");
  S.code="";
  showPanel(`<p class="label">Sicherheitstür · Reaktorraum</p><h2 id="ptitle">Code eingeben</h2>
   <p>${n<N?`Ihr habt erst ${n} von ${N} Ziffern. Ihr könnt es trotzdem versuchen …`:"Gebt die fünf Ziffern in der richtigen Reihenfolge ein."}</p>
   <div class="keytags">${tags}</div>
   <div class="keypad"><div class="display" id="disp" aria-live="polite">${"<span>–</span>".repeat(N)}</div>
   <div class="keys10">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join("")}<button class="del" data-d="del" aria-label="Löschen">⌫</button><button data-d="0">0</button><button class="go" data-d="ok" aria-label="Code prüfen">OK</button></div></div>
   <div id="fb" aria-live="polite"></div>`,".keys10 button");
  const disp=()=>{$("#disp").innerHTML=Array.from({length:N},(_,i)=>`<span>${S.code[i]??"–"}</span>`).join("")};
  panel.querySelectorAll(".keys10 button").forEach(b=>b.addEventListener("click",()=>{
    const d=b.dataset.d;
    if(d==="del")S.code=S.code.slice(0,-1);
    else if(d==="ok"){const want=ORDER.map(k=>S.st[k].digit).join("");
      if(n===N&&S.code===want){S.escaped=true;beep(true);setTimeout(()=>beep(true),250);setTimeout(()=>beep(true),500);renderAll();win();return}
      beep(false);$("#fb").innerHTML=`<div class="fb wrong"><b class="t">Code ungültig</b>${S.code.length<N?"Der Code hat fünf Ziffern.":n<N?"Euch fehlen noch Ziffern. Sucht weiter im Reaktorraum!":"Prüft die Ziffern und ihre Reihenfolge."}</div>`;S.code="";}
    else if(S.code.length<N)S.code+=d;
    disp();
  }));
}
function win(){
  const used=START-S.seconds;
  const carry={rest:S.seconds,fehler:(CARRY?CARRY.fehler:0)+S.mistakes,zeit:(CARRY?CARRY.zeit:0)+used,ts:Date.now()};
  try{localStorage.setItem("escape-potenz-r2",JSON.stringify(carry))}catch(e){}
  showPanel(`<p class="label">Zugang gewährt</p><h2 id="ptitle">Raum 2 geschafft!</h2>
   <p>Die Sicherheitstür öffnet sich. Ihr kennt die Eigenschaften der Grundfunktionen – und schreibt sie sauber in Intervall- und Mengenschreibweise!</p>
   <div class="stats"><div class="card"><div class="n">${fmt(used).replace("+","")}</div><span class="label">benötigte Zeit</span></div><div class="card"><div class="n">${S.mistakes}</div><span class="label">Fehlversuche</span></div><div class="card"><div class="n">20</div><span class="label">Abfragen</span></div></div>
   ${CARRY?`<p class="label">Bisher insgesamt: ${fmt(carry.zeit)} Zeit · ${carry.fehler} Fehlversuche</p>`:""}
   <p>Weiter geht es in Raum 3. Restzeit und Fehlversuche nehmt ihr mit.</p>
   <div class="row"><a class="btn" href="raum3.html?rest=${carry.rest}&fehler=${carry.fehler}&zeit=${carry.zeit}" target="_self">Weiter zu Raum 3 ➜</a><button class="btn alt" id="again">Nochmal mit neuen Abfragen</button></div>`,"a.btn");
  $("#again").addEventListener("click",restart);
}
function plan(){
  if(!S.started){intro();return}
  showPanel(`<h2 id="ptitle">Raumplan</h2><p>Das habt ihr schon entdeckt:</p>
   <div class="keytags">${ORDER.map((k,i)=>S.st[k].done?`<span class="keytag got">${ST[k].icon} ${ST[k].name}: ${i+1}. Ziffer ${S.st[k].digit}</span>`:(S.st[k].i>0?`<span class="keytag">${ST[k].icon} ${ST[k].name}: ${S.st[k].i} von 4</span>`:`<span class="keytag">❓ noch nicht gefunden</span>`)).join("")}</div>
   <p>Fehlversuche bisher: <b>${S.mistakes}</b></p><div class="row"><button class="btn" data-close>Zurück in den Reaktorraum</button></div>`);
}
function settings(){
  if(!S.started){intro();return}
  showPanel(`<h2 id="ptitle">Einstellungen</h2>
   <label class="switch"><input type="checkbox" id="s-sound" ${S.sound?"checked":""}> Töne bei richtig und falsch</label>
   <label class="switch"><input type="checkbox" id="s-timer" ${S.timerOn?"checked":""}> Stoppuhr anzeigen</label>
   <div class="row"><button class="btn" data-close>Fertig</button><button class="btn alt" id="s-new">Neues Spiel mit neuen Funktionen</button></div><div id="fb"></div>`);
  $("#s-sound").addEventListener("change",e=>S.sound=e.target.checked);
  $("#s-timer").addEventListener("change",e=>{S.timerOn=e.target.checked;renderTimer()});
  $("#s-new").addEventListener("click",()=>{$("#fb").innerHTML=`<div class="fb wrong">Wirklich neu starten? Alle Ziffern gehen verloren.<div class="row" style="margin-top:8px"><button class="btn" id="s-yes">Ja, neu starten</button></div></div>`;$("#s-yes").addEventListener("click",restart);});
}
function restart(){const snd=S.sound,tm=S.timerOn;S=newState();S.sound=snd;S.timerOn=tm;S.started=true;startTimer();closePanel();}

S=newState();renderAll();intro();
})();
</script>
