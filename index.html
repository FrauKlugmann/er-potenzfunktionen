<style>
/* Layout: Laborbild als Bühne mit Status-Anzeigen im Bild; Aufträge öffnen sich als Terminal-Fenster. Bewusst ein dunkles Labor-Design. */
[hidden]{display:none!important}
:root{
  --void:#08111f;
  --panel:#0f2036;
  --panel-2:#16304f;
  --line:#2c5a86;
  --text:#e6f1ff;
  --muted:#93acc8;
  --cyan:#3fe0ff;
  --yellow:#ffd23f;
  --magenta:#ff5bd8;
  --ok:#3ee08f;
  --bad:#ff5b6b;
  --display:"Orbitron","Trebuchet MS",sans-serif;
  --body:"Exo 2","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;background:var(--void);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .school{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.topbar .room{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 12px rgba(63,224,255,.45)}

.scene{position:relative;width:100%;max-width:100%;aspect-ratio:1672/941;border:2px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 28px rgba(63,224,255,.18);background:#000;container-type:inline-size}
.scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:2px dashed var(--cyan);outline-offset:2px}

/* Anzeigen im Bild */
.h-top,.h-prog,.h-inv{position:absolute;z-index:2;font-family:var(--display);font-weight:800;color:var(--text)}
.glass{background:rgba(8,20,36,.82);border:.2cqw solid var(--cyan);box-shadow:0 0 1.2cqw rgba(63,224,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.h-top{right:1.2%;top:1.6%;height:7%;display:flex;gap:.6cqw;font-size:1.8cqw}
.h-pill{height:100%;display:flex;align-items:center;gap:.6cqw;padding:0 1.1cqw;border-radius:1cqw;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-pill.late{color:var(--bad);border-color:var(--bad)}
.h-gear{height:100%;aspect-ratio:1;border-radius:1cqw;font-size:1.1em;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--text)}
.h-gear:hover,.map:hover{border-color:var(--yellow)}
.h-gear:focus-visible,.map:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.h-prog{left:1.2%;bottom:2.4%;width:19%;padding:.8cqw 1.1cqw;border-radius:1cqw;font-size:1.15cqw;display:flex;flex-direction:column;gap:.5cqw}
.h-lab{letter-spacing:.08em;color:var(--cyan)}
.h-dots{display:flex;justify-content:space-between}
.h-dots>span{display:flex;flex-direction:column;align-items:center;gap:.2cqw;font-size:.95em}
.h-dots i{width:2cqw;height:2cqw;border-radius:50%;border:.2cqw solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8em;color:#06121f}
.h-dots i.on{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 .8cqw var(--yellow)}
.h-dots i.ok{background:var(--ok);border-color:var(--ok)}
.h-inv{left:28%;bottom:2.4%;width:40%;padding:.7cqw 1cqw;border-radius:1cqw;display:flex;align-items:center;gap:.8cqw;font-size:1.15cqw}
.h-inv .h-lab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.95em}
.h-slots{display:flex;gap:.7cqw;flex:1}
.h-slots .s{flex:1;aspect-ratio:1.1;border-radius:.7cqw;border:.2cqw dashed var(--line);display:grid;place-items:center;font-size:1.7cqw;color:#06121f;background:rgba(255,255,255,.03);padding:0;font-family:var(--display);font-weight:800}
.h-slots .s.got{background:var(--yellow);border:.2cqw solid var(--yellow);box-shadow:0 0 1cqw rgba(255,210,63,.5)}
.h-slots .map{border-style:solid;border-color:var(--cyan);cursor:pointer;font-size:2.2cqw;color:var(--text)}

footer{color:var(--muted);text-align:right;font-size:.85rem;padding-top:4px}

/* Terminal-Fenster */
.overlay{position:fixed;inset:0;background:rgba(2,8,16,.78);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel) 120px);border:2px solid var(--cyan);border-radius:12px;box-shadow:0 0 40px rgba(63,224,255,.25);width:min(820px,100%);max-height:100%;overflow:auto;padding:20px 22px 22px;position:relative;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.04em;margin:0;line-height:1.2;text-wrap:balance;color:var(--cyan)}
.panel p{margin:0}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:1.2rem;font-weight:800;cursor:pointer;line-height:1}
.close:hover{border-color:var(--bad);color:var(--bad)}
.close:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:48px}
.label{font-family:var(--display);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:2rem;font-weight:700;text-align:center;color:var(--yellow);letter-spacing:.02em}
.eq sup{font-size:.6em}
.task{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:center}
.graphbox{background:#06101d;border:1px solid var(--line);border-radius:10px;padding:6px}
svg.graph{width:100%;height:auto;display:block}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.05em;border:2px solid var(--line);border-radius:10px;padding:.8em 1em;cursor:pointer;color:var(--text);background:var(--panel);text-align:left}
.choice:hover:not(:disabled){border-color:var(--cyan);background:var(--panel-2)}
.choice:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.choice:disabled{opacity:.35;cursor:default}
.choice.right{border-color:var(--ok);background:rgba(62,224,143,.15);opacity:1}
.choice svg{flex:0 0 auto}
.fb{border-radius:10px;padding:12px 14px;font-weight:600;border:1px solid}
.fb.good{background:rgba(62,224,143,.12);border-color:var(--ok)}
.fb.wrong{background:rgba(255,91,107,.12);border-color:var(--bad)}
.fb.tip{background:rgba(255,210,63,.1);border-color:var(--yellow)}
.fb b.t{font-family:var(--display);font-weight:800;letter-spacing:.04em;display:block;margin-bottom:2px}
.fb.good b.t{color:var(--ok)} .fb.wrong b.t{color:var(--bad)} .fb.tip b.t{color:var(--yellow)}
.btn{font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.06em;background:var(--cyan);color:#04121f;border:2px solid var(--cyan);border-radius:10px;padding:.75em 1.3em;cursor:pointer;box-shadow:0 0 18px rgba(63,224,255,.35);text-decoration:none;display:inline-block}
.btn:hover{background:#86edff}
.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--yellow);text-shadow:0 0 14px rgba(255,210,63,.5)}
.keytags{display:flex;gap:8px;flex-wrap:wrap}
.keytag{border:1px solid var(--line);border-radius:8px;padding:.3em .7em;font-weight:700;font-family:var(--display);font-size:.8rem;letter-spacing:.04em}
.keytag.got{border-color:var(--yellow);color:var(--yellow)}
.merk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.merk .card{display:flex;flex-direction:column;gap:6px}
.merk h4{margin:0;font-family:"Cambria Math","Times New Roman",serif;font-size:1.3rem;color:var(--yellow)}
.merk ul{margin:0;padding-left:1.1em;font-size:.95rem}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats .card{flex:1 1 150px;text-align:center}
.stats .n{font-family:var(--display);font-size:1.9rem;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--cyan)}

/* Tastenfeld */
.keypad{display:flex;flex-direction:column;align-items:center;gap:12px}
.display{display:flex;gap:8px}
.display span{width:50px;height:62px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#030a12;color:var(--ok);font-family:var(--display);font-size:2rem;font-weight:800;text-shadow:0 0 10px rgba(62,224,143,.6)}
.keys10{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keys10 button{height:52px;border:2px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);font-family:var(--display);font-weight:800;font-size:1.25rem;cursor:pointer}
.keys10 button:hover{border-color:var(--cyan)}
.keys10 button:active{transform:translateY(1px)}
.keys10 button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.keys10 .del{color:var(--bad)} .keys10 .go{background:var(--ok);color:#04121f;border-color:var(--ok)}

@media (max-width:640px){
  .task{grid-template-columns:1fr}
  .panel{padding:16px}
  .panel h2{font-size:1.15rem}
  .eq{font-size:1.6rem}
}
</style>

/* ---------- Koordinatensystem ---------- */
const R=4, VB=380, M=24, SC=(VB-2*M)/(2*R);
const PX=x=>M+(x+R)*SC, PY=y=>M+(R-y)*SC;
function curvePts(key){
  const f=FN[key];const segs=[];let cur=[];
  for(let x=-R;x<=R+1e-9;x+=0.02){
    const xx=Math.abs(x)<1e-9?0:x;
    if(!f.ok(xx)){if(cur.length)segs.push(cur);cur=[];continue}
    const y=f.f(xx);
    if(!isFinite(y)||Math.abs(y)>R+0.6){if(cur.length)segs.push(cur);cur=[];continue}
    cur.push([xx,y]);
  }
  if(cur.length)segs.push(cur);return segs;
}
function graphSVG(set,size){
  let s=`<svg class="graph" viewBox="0 0 ${VB} ${VB}" role="img" aria-label="Koordinatensystem mit drei Graphen A, B und C">`;
  s+=`<defs><clipPath id="clip"><rect x="${M}" y="${M}" width="${VB-2*M}" height="${VB-2*M}"/></clipPath></defs>`;
  for(let i=-R;i<=R;i++){s+=`<line x1="${PX(i)}" y1="${PY(R)}" x2="${PX(i)}" y2="${PY(-R)}" stroke="#16324f" stroke-width="1"/><line x1="${PX(-R)}" y1="${PY(i)}" x2="${PX(R)}" y2="${PY(i)}" stroke="#16324f" stroke-width="1"/>`;}
  s+=`<line x1="${PX(-R)}" y1="${PY(0)}" x2="${PX(R)+10}" y2="${PY(0)}" stroke="#cfe3ff" stroke-width="1.6"/><polygon points="${PX(R)+14},${PY(0)} ${PX(R)+6},${PY(0)-4} ${PX(R)+6},${PY(0)+4}" fill="#cfe3ff"/>`;
  s+=`<line x1="${PX(0)}" y1="${PY(-R)}" x2="${PX(0)}" y2="${PY(R)-10}" stroke="#cfe3ff" stroke-width="1.6"/><polygon points="${PX(0)},${PY(R)-14} ${PX(0)-4},${PY(R)-6} ${PX(0)+4},${PY(R)-6}" fill="#cfe3ff"/>`;
  s+=`<text x="${PX(R)+6}" y="${PY(0)+18}" fill="#cfe3ff" font-size="14" font-style="italic" font-family="serif">x</text><text x="${PX(0)+8}" y="${PY(R)-4}" fill="#cfe3ff" font-size="14" font-style="italic" font-family="serif">y</text>`;
  for(let i=-R+1;i<R;i++){if(!i)continue;
    s+=`<line x1="${PX(i)}" y1="${PY(0)-3}" x2="${PX(i)}" y2="${PY(0)+3}" stroke="#cfe3ff"/><text x="${PX(i)}" y="${PY(0)+15}" fill="#93acc8" font-size="11" text-anchor="middle" font-family="sans-serif" stroke="#06101d" stroke-width="3" paint-order="stroke">${i<0?"−"+(-i):i}</text>`;
    s+=`<line x1="${PX(0)-3}" y1="${PY(i)}" x2="${PX(0)+3}" y2="${PY(i)}" stroke="#cfe3ff"/><text x="${PX(0)-7}" y="${PY(i)+4}" fill="#93acc8" font-size="11" text-anchor="end" font-family="sans-serif" stroke="#06101d" stroke-width="3" paint-order="stroke">${i<0?"−"+(-i):i}</text>`;}
  const all=set.map(k=>curvePts(k));
  all.forEach((segs,ci)=>{segs.forEach(seg=>{const d=seg.map((p,j)=>(j?"L":"M")+PX(p[0]).toFixed(1)+","+PY(p[1]).toFixed(1)).join(" ");
    s+=`<path d="${d}" fill="none" stroke="${COLORS[ci].c}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${COLORS[ci].d}" clip-path="url(#clip)"/>`;});});
  /* Beschriftung A, B, C dort, wo die Kurve frei liegt */
  const flat=all.map(segs=>segs.flat().filter(p=>Math.abs(p[0])<R-0.3&&Math.abs(p[1])<R-0.4&&Math.abs(p[0])>0.25));
  const placed=[];
  all.forEach((segs,ci)=>{
    let best=null,bs=-1;
    flat[ci].forEach((p,j)=>{if(j%5)return;
      let dmin=9;flat.forEach((o,cj)=>{if(cj===ci)return;o.forEach(q=>{const d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<dmin)dmin=d})});
      placed.forEach(q=>{const d=Math.hypot(p[0]-q[0],p[1]-q[1])/1.5;if(d<dmin)dmin=d});
      if(dmin>bs){bs=dmin;best=p}});
    if(!best)return;placed.push(best);
    const lx=PX(best[0])+(best[0]>=0?12:-12), ly=PY(best[1])-10;
    s+=`<g><circle cx="${lx}" cy="${ly}" r="12" fill="#06101d" stroke="${COLORS[ci].c}" stroke-width="2"/><text x="${lx}" y="${ly+5}" fill="${COLORS[ci].c}" font-size="14" font-weight="800" text-anchor="middle" font-family="Orbitron,sans-serif">${LET[ci]}</text></g>`;
  });
  return s+"</svg>";
}
const swatch=ci=>`<svg width="38" height="14" viewBox="0 0 38 14" aria-hidden="true"><line x1="2" y1="7" x2="36" y2="7" stroke="${COLORS[ci].c}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${COLORS[ci].d}"/></svg>`;

function door(){
  if(S.escaped)return win();
  const n=keysGot();
  const tags=ORDER.map((k,i)=>`<span class="keytag ${S.st[k].done?"got":""}">${i+1}. Ziffer: ${S.st[k].done?S.st[k].digit:"?"}</span>`).join("");
  S.code="";
  showPanel(`<p class="label">Sicherheitstür · Labor 1</p><h2 id="ptitle">Code eingeben</h2>
   <p>${n<N?`Ihr habt erst ${n} von ${N} Ziffern. Ihr könnt es trotzdem versuchen …`:"Gebt die fünf Ziffern in der richtigen Reihenfolge ein."}</p>
   <div class="keytags">${tags}</div>
   <div class="keypad"><div class="display" id="disp" aria-live="polite">${"<span>–</span>".repeat(N)}</div>
   <div class="keys10">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join("")}<button class="del" data-d="del" aria-label="Löschen">⌫</button><button data-d="0">0</button><button class="go" data-d="ok" aria-label="Code prüfen">OK</button></div></div>
   <div id="fb" aria-live="polite"></div>`,".keys10 button");
  const disp=()=>{$("#disp").innerHTML=Array.from({length:N},(_,i)=>`<span>${S.code[i]??"–"}</span>`).join("")};
  panel.querySelectorAll(".keys10 button").forEach(b=>b.addEventListener("click",()=>{

    else if(S.code.length<N)S.code+=d;

  }));

function win(){
  const used=MIN*60-S.seconds;
  const carry={rest:S.seconds,fehler:S.mistakes,zeit:used,ts:Date.now()};
  try{localStorage.setItem("escape-potenz-r1",JSON.stringify(carry))}catch(e){}
  showPanel(`<p class="label">Zugang gewährt</p><h2 id="ptitle">Raum 1 geschafft!</h2>
   <p>Die Sicherheitstür gleitet zischend zur Seite. Ihr erkennt die Graphen der Grundfunktionen x², x³, x⁻¹, x⁻² und √x!</p>
   <div class="stats"><div class="card"><div class="n">${fmt(used).replace("+","")}</div><span class="label">benötigte Zeit</span></div><div class="card"><div class="n">${S.mistakes}</div><span class="label">Fehlversuche</span></div><div class="card"><div class="n">${N}</div><span class="label">Analysen</span></div></div>
   <p>Hinter der Tür wartet Raum 2: Transformation. Restzeit und Fehlversuche nehmt ihr mit.</p>
   <div class="row"><a class="btn" href="raum2.html?rest=${carry.rest}&fehler=${carry.fehler}&zeit=${carry.zeit}" target="_self">Weiter zu Raum 2 ➜</a><button class="btn alt" id="again">Nochmal mit neuen Aufträgen</button></div>`,"a.btn");
  $("#again").addEventListener("click",restart);
}
function plan(){
  if(!S.started){intro();return}
  showPanel(`<h2 id="ptitle">Laborplan</h2><p>Das habt ihr schon entdeckt:</p>
   <div class="keytags">${ORDER.map((k,i)=>S.st[k].done?`<span class="keytag got">${ST[k].icon} ${ST[k].name}: ${i+1}. Ziffer ${S.st[k].digit}</span>`:(S.st[k].fails?`<span class="keytag">${ST[k].icon} ${ST[k].name}: angefangen</span>`:`<span class="keytag">❓ noch nicht gefunden</span>`)).join("")}</div>
   <p>Fehlversuche bisher: <b>${S.mistakes}</b></p><div class="row"><button class="btn" data-close>Zurück ins Labor</button></div>`);
}
function settings(){
  if(!S.started){intro();return}
  showPanel(`<h2 id="ptitle">Einstellungen</h2>
   <label class="switch"><input type="checkbox" id="s-sound" ${S.sound?"checked":""}> Töne bei richtig und falsch</label>
   <label class="switch"><input type="checkbox" id="s-timer" ${S.timerOn?"checked":""}> Stoppuhr anzeigen (30 Minuten)</label>
   <div class="row"><button class="btn" data-close>Fertig</button><button class="btn alt" id="s-new">Neues Spiel mit neuen Aufträgen</button></div><div id="fb"></div>`);
  $("#s-sound").addEventListener("change",e=>S.sound=e.target.checked);
  $("#s-timer").addEventListener("change",e=>{S.timerOn=e.target.checked;renderTimer()});
  $("#s-new").addEventListener("click",()=>{$("#fb").innerHTML=`<div class="fb wrong">Wirklich neu starten? Alle Ziffern gehen verloren.<div class="row" style="margin-top:8px"><button class="btn" id="s-yes">Ja, neu starten</button></div></div>`;$("#s-yes").addEventListener("click",restart);});
}
function restart(){const snd=S.sound,tm=S.timerOn;S=newState();S.sound=snd;S.timerOn=tm;S.started=true;startTimer();closePanel();}

S=newState();renderAll();intro();
})();
</script>
<style>
/* Bewegte Stellen im Bild (liegen unter den Klickflächen, nehmen keine Klicks an) */
.fx{position:absolute;pointer-events:none;z-index:1}
.scene.final .fx{display:none}
.fx-scan{overflow:hidden;border-radius:.4cqw;mix-blend-mode:screen}
.fx-scan::before{content:"";position:absolute;left:0;right:0;height:18%;top:-20%;background:linear-gradient(180deg,rgba(63,224,255,0),rgba(63,224,255,.28),rgba(63,224,255,0));animation:fxscan 3.6s linear infinite}
.fx-scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px);animation:fxflick 4.5s steps(1) infinite}
@keyframes fxscan{to{top:110%}}
@keyframes fxflick{0%,100%{opacity:1}47%{opacity:.4}48%{opacity:1}83%{opacity:.6}84%{opacity:1}}
.fx-cube{perspective:60cqw;display:grid;place-items:center}
.fx-cube .c3{position:relative;width:5.2cqw;height:5.2cqw;transform-style:preserve-3d;animation:fxspin 9s linear infinite}
.fx-cube .c3 i{position:absolute;inset:0;border:.22cqw solid #bff6ff;box-shadow:0 0 .9cqw #3fe0ff,inset 0 0 .9cqw rgba(63,224,255,.6);background:rgba(63,224,255,.06)}
.fx-cube .c3 i:nth-child(1){transform:translateZ(2.6cqw)} .fx-cube .c3 i:nth-child(2){transform:rotateY(180deg) translateZ(2.6cqw)}
.fx-cube .c3 i:nth-child(3){transform:rotateY(90deg) translateZ(2.6cqw)} .fx-cube .c3 i:nth-child(4){transform:rotateY(-90deg) translateZ(2.6cqw)}
.fx-cube .c3 i:nth-child(5){transform:rotateX(90deg) translateZ(2.6cqw)} .fx-cube .c3 i:nth-child(6){transform:rotateX(-90deg) translateZ(2.6cqw)}
@keyframes fxspin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.fx-float{animation:fxfloat 4s ease-in-out infinite}
@keyframes fxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5cqw)}}
.fx-glow{border-radius:50%;mix-blend-mode:screen;animation:fxpulse 2.4s ease-in-out infinite}
@keyframes fxpulse{0%,100%{opacity:.35}50%{opacity:.85}}
.fx-lamp{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,214,140,.85),rgba(255,170,60,.35) 45%,rgba(255,150,40,0) 70%);animation:fxlamp 5s steps(1) infinite}
@keyframes fxlamp{0%,100%{opacity:.9}31%{opacity:.25}32%{opacity:.9}34%{opacity:.4}35%{opacity:.95}72%{opacity:.6}73%{opacity:.95}}
.fx-sign{border-radius:.6cqw;mix-blend-mode:screen;box-shadow:0 0 2cqw 1cqw rgba(60,255,120,.55);animation:fxpulse 3s ease-in-out infinite}
.fx-led{border-radius:50%;mix-blend-mode:screen;animation:fxblink 1.6s steps(1) infinite}
@keyframes fxblink{0%,100%{opacity:1}50%{opacity:.05}}
canvas.fx{mix-blend-mode:screen}
svg.fx{overflow:visible}
@media (prefers-reduced-motion:reduce){.fx,.fx *,.fx::before,.fx::after{animation:none!important}}
</style>
<script>
(function(){
"use strict";
const ROOM=1, IW=1672, IH=941;
const scene=document.getElementById("scene");if(!scene)return;
const firstHot=scene.querySelector(".hot,.h-top");
const P=(x1,y1,x2,y2)=>`left:${x1/IW*100}%;top:${y1/IH*100}%;width:${(x2-x1)/IW*100}%;height:${(y2-y1)/IH*100}%`;
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function add(tag,cls,box,html){const e=document.createElement(tag);e.className="fx "+cls;if(box)e.style.cssText=P(...box);if(html)e.innerHTML=html;e.setAttribute("aria-hidden","true");scene.insertBefore(e,firstHot);return e}
function canvas(box,draw,fps){
  const c=add("canvas","",box);const ctx=c.getContext("2d");
  const size=()=>{const r=c.getBoundingClientRect();c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio)};
  size();addEventListener("resize",size);
  if(reduce){draw(ctx,c.width,c.height,0);return}
  let last=0;(function loop(t){if(t-last>1000/fps){last=t;if(!scene.classList.contains("final")&&c.width>1)draw(ctx,c.width,c.height,t)}requestAnimationFrame(loop)})(0);
}
/* gezackter Blitz von (x1|y1) nach (x2|y2) */
function bolt(ctx,x1,y1,x2,y2,w,col,depth){
  const pts=[[x1,y1]],n=10;
  for(let i=1;i<n;i++){const t=i/n;pts.push([x1+(x2-x1)*t+(Math.random()-.5)*w*9,y1+(y2-y1)*t+(Math.random()-.5)*w*3])}
  pts.push([x2,y2]);
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.shadowColor=col;ctx.shadowBlur=w*5;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
  if(depth>0&&Math.random()<.6){const k=2+Math.floor(Math.random()*6),p=pts[k];bolt(ctx,p[0],p[1],p[0]+(Math.random()-.5)*w*40,p[1]+w*(8+Math.random()*12),w*.6,col,depth-1)}
}

if(ROOM===1){
  add("div","fx-cube",[600,140,760,290],'<div class="fx-float"><div class="c3"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>');
  add("div","fx-glow",[610,160,750,280]).style.background="radial-gradient(circle,rgba(63,224,255,.45),rgba(63,224,255,0) 65%)";
  [[244,352,497,548],[516,351,765,543],[779,349,1018,531]].forEach((b,i)=>{const e=add("div","fx-scan",b);e.style.animationDelay=(-i*1.2)+"s";e.firstChild;e.style.setProperty("--d",i)});
}
if(ROOM===2){
  /* Blitze im Reaktor */
  canvas([880,150,1110,470],(ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation="lighter";
    const n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){const x=w*(.15+Math.random()*.7);bolt(ctx,x,0,w*(.2+Math.random()*.6),h,Math.max(1.5,w/110),Math.random()<.5?"rgba(190,240,255,.95)":"rgba(120,210,255,.9)",2)}
    ctx.globalCompositeOperation="source-over";
  },11);
  add("div","fx-glow",[860,120,1130,480]).style.background="radial-gradient(ellipse,rgba(120,220,255,.35),rgba(63,224,255,0) 65%)";
  const g=add("div","fx-glow",[195,565,360,710]);g.style.background="radial-gradient(circle,rgba(63,224,255,.4),rgba(63,224,255,0) 65%)";g.style.animationDuration="3.2s";
}
if(ROOM===3){
  /* flimmernde Laserstrahlen mit wanderndem Lichtpuls */
  const beams=[[212,511,418,563],[458,575,612,613],[706,614,1066,503],[1066,503,708,456]];
  const s=add("svg","",[0,0,IW,IH]);s.setAttribute("viewBox",`0 0 ${IW} ${IH}`);s.setAttribute("preserveAspectRatio","none");
  s.innerHTML=`<defs><filter id="lb" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>`+
   beams.map((b,i)=>`<line x1="${b[0]}" y1="${b[1]}" x2="${b[2]}" y2="${b[3]}" stroke="#ff4a4a" stroke-width="7" filter="url(#lb)" opacity=".5"><animate attributeName="opacity" values=".35;.8;.45;.7;.35" dur="${0.7+i*.13}s" repeatCount="indefinite"/></line>
     <line x1="${b[0]}" y1="${b[1]}" x2="${b[2]}" y2="${b[3]}" stroke="#ffd0d0" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 260" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-286" dur="1.1s" begin="${i*.27}s" repeatCount="indefinite"/></line>`).join("");
  s.style.mixBlendMode="screen";
  /* Plasmakugel */
  canvas([55,190,205,340],(ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);const cx=w*.5,cy=h*.5,r=w*.47;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.globalCompositeOperation="lighter";
    const n=5+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;bolt(ctx,cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.max(1.2,w/120),Math.random()<.5?"rgba(225,150,255,.95)":"rgba(170,120,255,.9)",1)}
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.25);g.addColorStop(0,"rgba(255,230,255,.9)");g.addColorStop(1,"rgba(255,200,255,0)");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.restore();
  },9);
}
if(ROOM===4){
  add("div","fx-lamp",[770,140,870,245]);
  add("div","fx-sign",[1158,148,1365,205]);
  [[830,374,"#7dff9e",0],[844,374,"#7dff9e",.4],[861,402,"#7dff9e",.9],[829,432,"#ff5050",.2],[844,465,"#7dff9e",1.2],[905,402,"#ffb347",.6]].forEach(([x,y,c,d])=>{
    const e=add("div","fx-led",[x-7,y-7,x+7,y+7]);e.style.background=`radial-gradient(circle,${c},rgba(0,0,0,0) 70%)`;e.style.boxShadow=`0 0 .8cqw ${c}`;e.style.animationDelay=d+"s";e.style.animationDuration=(1.2+d)+"s";});
}
})();
</script>
